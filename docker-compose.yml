services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clawkit
      POSTGRES_PASSWORD: clawkit
      POSTGRES_DB: clawkit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://clawkit:clawkit@postgres:5432/clawkit?schema=public
      DIRECT_URL: postgresql://clawkit:clawkit@postgres:5432/clawkit?schema=public
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server

volumes:
  pgdata:
  client_node_modules:
